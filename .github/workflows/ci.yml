
name: HostelHub CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-build:
    name: Frontend Build and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        working-directory: client
        run: npm ci

      - name: Run Frontend Lint
        working-directory: client
        run: npm run lint

      - name: Build React Application
        working-directory: client
        run: npm run build

  backend-check:
    name: Backend Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Backend Dependencies
        run: npm ci

      - name: Check Backend JavaScript Syntax
        run: node --check server/server.js

      - name: Check Database File Syntax
        run: node --check server/db.js
